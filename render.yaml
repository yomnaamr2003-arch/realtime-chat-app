# Deployment config for Render.com (free tier).
# Import this repo at https://dashboard.render.com/select-repo?type=blueprint
# Render reads this file automatically and provisions the service below.
services:
  - type: web
    name: realtime-chat-app
    env: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DB_PATH
        value: ./data/chat.db
    # No `disk:` block on purpose: persistent disks are a paid-plan feature on
    # Render and trigger a credit-card requirement even on an otherwise-free
    # service. Without one, the SQLite file lives on the instance's local
    # (ephemeral) filesystem: it persists across requests and restarts, but
    # is wiped on every new deploy and on Render's periodic free-instance
    # spin-downs. Fine for a demo/learning project. If you need data to
    # survive redeploys, swap in a free managed Postgres (e.g. Render's free
    # Postgres, Supabase, or Neon) instead of SQLite.
