name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start server
        run: |
          echo "JWT_SECRET=ci_test_secret_do_not_use_in_prod" >> .env
          echo "DB_PATH=./data/ci.db" >> .env
          nohup node server.js > server.log 2>&1 &
          npx wait-on http://localhost:3000/api/health --timeout 20000

      - name: Smoke test /api/health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health)
          echo "Health check status: $STATUS"
          test "$STATUS" -eq 200

      - name: Show server log on failure
        if: failure()
        run: cat server.log || true
